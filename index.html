<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A simple and responsive to-do list application.">
  <title>Daily Focus | To-Do List</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <a class="brand" href="#"><span class="brand-mark">✓</span> daily<span>focus</span></a>
      <span class="date-label" id="todayLabel"></span>
    </header>

    <section class="welcome">
      <p class="eyebrow">YOUR PERSONAL TASK SPACE</p>
      <h1>Make today<br><span>count.</span></h1>
      <p class="intro">Small steps every day lead to big results. What's on your list?</p>
    </section>

    <section class="task-panel" aria-label="Task manager">
      <form id="taskForm" class="task-form">
        <label class="sr-only" for="taskInput">Enter a new task</label>
        <input id="taskInput" type="text" placeholder="Add a task to your day..." maxlength="100" autocomplete="off" required>
        <button type="submit">Add task <span>＋</span></button>
      </form>

      <div class="task-toolbar">
        <div><span class="eyebrow">YOUR TASKS</span><span class="task-count" id="taskCount">0 tasks</span></div>
        <div class="filters" role="group" aria-label="Filter tasks">
          <button class="filter active" data-filter="all" type="button">All</button>
          <button class="filter" data-filter="active" type="button">Active</button>
          <button class="filter" data-filter="completed" type="button">Completed</button>
        </div>
      </div>

      <ul id="taskList" class="task-list" aria-live="polite"></ul>
      <div id="emptyState" class="empty-state">
        <div class="empty-icon">✦</div>
        <h2>Your day is a blank page.</h2>
        <p>Add your first task and get started.</p>
      </div>

      <footer class="list-footer">
        <span id="remainingCount">0 tasks left</span>
        <button id="clearCompleted" type="button">Clear completed</button>
      </footer>
    </section>

    <p class="footer-note">A little progress is still progress. <span>✳</span></p>
  </main>
  <script src="script.js"></script>
</body>
</html>
